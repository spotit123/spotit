<title>Pizza contro i piccioni</title>
<style>
  :root{--bg:#1d1a2b;--sky:#87ceeb;--fg:#fff;--ink:#14121f;color-scheme:dark}
  html,body{height:100%}
  body{margin:0;padding-inline:16px;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;
    display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:8px;box-sizing:border-box}
  h1{margin:0;font-size:1.1rem;text-align:center}
  p{margin:0;font-size:.8rem;opacity:.8;text-align:center}
  canvas{flex:1;min-height:0;max-width:100%;aspect-ratio:3/4;background:var(--sky);border:3px solid var(--fg);touch-action:none;cursor:none}
</style>
<h1>PIZZA CONTRO I PICCIONI</h1>
<p>Mouse, dito o frecce. Mangia le pizze, schiva i piccioni.</p>
<canvas id="c" width="480" height="640"></canvas>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');
const frasi=["Che schifo!","Glub.","Nonna approva.","Piccione-fobia!","Ancora?!","Sono un'anatra?","BURP"];
let me,items=[],score=0,best=0,state='start',t=0,msg='',msgT=0,keys={};
function reset(){me={x:240,y:570,r:20};items=[];score=0;t=0;state='play';}
function pointer(e){const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;
  if(me)me.x=(p.clientX-r.left)*c.width/r.width;}
function press(e){e.preventDefault();pointer(e);if(state!=='play')reset();}
c.addEventListener('mousemove',pointer);
c.addEventListener('touchmove',e=>{e.preventDefault();pointer(e)},{passive:false});
c.addEventListener('mousedown',press);
c.addEventListener('touchstart',press,{passive:false});
addEventListener('keydown',e=>{keys[e.key]=1;if(e.key===' '&&state!=='play'){e.preventDefault();reset();}});
addEventListener('keyup',e=>{keys[e.key]=0});
me={x:240,y:570,r:20};
function loop(){
  t++;
  if(state==='play'){
    if(keys.ArrowLeft)me.x-=7;if(keys.ArrowRight)me.x+=7;
    if(t%28===0)items.push({x:Math.random()*440+20,y:-20,pizza:Math.random()<.62,vy:2+Math.random()*1.5+Math.min(score/60,3)});
    for(const i of items){i.y+=i.vy;
      if(Math.hypot(i.x-me.x,i.y-me.y)<me.r+10){i.dead=true;
        if(i.pizza){score++;me.r=Math.min(me.r+1.2,60);if(score%5===0){msg=frasi[Math.random()*frasi.length|0];msgT=70;}}
        else{state='over';best=Math.max(best,score);}}}
    items=items.filter(i=>!i.dead&&i.y<680);
    me.x=Math.max(me.r,Math.min(480-me.r,me.x));
  }
  g.clearRect(0,0,480,640);
  g.textAlign='center';g.font='30px serif';
  for(const i of items)g.fillText(i.pizza?'🍕':'🐦',i.x,i.y+10);
  g.font=me.r*1.8+'px serif';
  g.save();g.translate(me.x,me.y);g.rotate(Math.sin(t/8)*.2);
  g.fillText(state==='over'?'💀':'🐷',0,me.r*.6);g.restore();
  g.fillStyle='#14121f';g.font='18px monospace';g.textAlign='left';
  g.fillText('Pizze: '+score+'  Ciccia: '+Math.round(me.r*5)+' kg  Record: '+best,10,26);
  if(msgT>0){msgT--;g.textAlign='center';g.fillText(msg,me.x,me.y-me.r*2-6);}
  if(state!=='play'){
    g.fillStyle='rgba(20,18,31,.75)';g.fillRect(0,200,480,170);
    g.fillStyle='#fff';g.textAlign='center';g.font='30px monospace';
    g.fillText(state==='start'?'PIZZA vs PICCIONI':'SEI STATO PICCIONATO',240,260);
    g.font='16px monospace';
    g.fillText(state==='start'?'Mangia 🍕, evita 🐦':'Pizze mangiate: '+score,240,295);
    g.fillText('Tocca o premi SPAZIO per giocare',240,335);}
  requestAnimationFrame(loop);
}
loop();
</script>
